# Local automation stack: n8n (+ its Postgres) and Mailpit as the mock inbox.
# The Next.js app and Convex run on the host (`npm run dev`, `npx convex dev`).
#
#   cp .env.example .env   # fill in the secrets
#   docker compose up -d
#
# n8n editor: http://localhost:5678   Mailpit inbox: http://localhost:8025

x-n8n-env: &n8n-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: n8n
  DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD in .env}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
  GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
  TZ: ${GENERIC_TIMEZONE:-UTC}
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  # Code nodes sign and verify with Node's crypto module and read the two
  # LendLoop secrets below from the environment.
  NODE_FUNCTION_ALLOW_BUILTIN: crypto
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
  # LendLoop integration settings (see README > Environment variables).
  CONVEX_TO_N8N_SECRET: ${CONVEX_TO_N8N_SECRET:?set CONVEX_TO_N8N_SECRET in .env}
  N8N_TO_CONVEX_SECRET: ${N8N_TO_CONVEX_SECRET:?set N8N_TO_CONVEX_SECRET in .env}
  CONVEX_SITE_URL: ${CONVEX_SITE_URL:?set CONVEX_SITE_URL in .env}
  LENDLOOP_APP_URL: ${LENDLOOP_APP_URL:-http://localhost:3100}
  LENDLOOP_MAIL_FROM: ${LENDLOOP_MAIL_FROM:-LendLoop <noreply@lendloop.local>}

services:
  postgres:
    image: postgres:16.13-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD in .env}
    volumes:
      - n8n-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  # One-shot: imports the Mailpit credential and the three workflows, then
  # publishes them. Safe to re-run; imports overwrite by id.
  n8n-import:
    image: n8nio/n8n:2.43.8
    environment: *n8n-env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./n8n:/seed:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        n8n import:credentials --input=/seed/credentials/mailpit-smtp.json &&
        n8n import:workflow --separate --input=/seed/workflows &&
        n8n publish:workflow --id=lendloopErrors01 &&
        n8n publish:workflow --id=lendloopNotify01 &&
        n8n publish:workflow --id=lendloopOverdue1

  n8n:
    image: n8nio/n8n:2.43.8
    restart: unless-stopped
    environment:
      <<: *n8n-env
      WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://localhost:5678/}
    ports:
      - "127.0.0.1:5678:5678"
    extra_hosts:
      # Lets n8n reach a Convex local deployment on the host (CONVEX_SITE_URL=http://host.docker.internal:3211).
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      n8n-import:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

volumes:
  n8n-db:
  n8n-data:
